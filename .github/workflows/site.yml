name: Site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - landing/**
      - scripts/**
      - shared/**
      - package.json
      - package-lock.json
      - .github/workflows/site.yml
  pull_request:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ttlequals0/MinusPod
          ref: main
          path: .main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN_DOCS: ${{ vars.CF_BEACON_TOKEN_DOCS }}
          PUBLIC_CF_BEACON_TOKEN_LANDING: ${{ vars.CF_BEACON_TOKEN_LANDING }}
      - run: npm run check
      - if: github.event_name == 'pull_request'
        run: |
          npx wrangler deploy --dry-run --config docs/wrangler.jsonc
          npx wrangler deploy --dry-run --config landing/wrangler.jsonc
      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing/dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
      - uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: landing/dist
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing
          command: deploy

name: Site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - landing/**
      - scripts/**
      - shared/**
      - package.json
      - package-lock.json
      - .nvmrc
      - vitest.config.mjs
      - .github/workflows/site.yml
  pull_request:
  repository_dispatch:
    types: [docs-updated]
  # daily, so the footer star and fork counts and the MinusPodJev benchmark stay current
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ttlequals0/MinusPod
          ref: main
          path: .main
          # full history without old blobs: prepare-landing dates each video by its last commit
          fetch-depth: 0
          filter: blob:none
      - uses: actions/checkout@v5
        with:
          repository: ttlequals0/MinusPodJev
          ref: main
          path: .jev
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_CF_BEACON_TOKEN_DOCS: ${{ vars.CF_BEACON_TOKEN_DOCS }}
          PUBLIC_CF_BEACON_TOKEN_LANDING: ${{ vars.CF_BEACON_TOKEN_LANDING }}
          # for scripts/repo-stats.mjs
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run check
      - if: github.event_name == 'pull_request'
        run: |
          npx wrangler deploy --dry-run --config docs/wrangler.jsonc
          npx wrangler deploy --dry-run --config landing/wrangler.jsonc
          mkdir -p demo/dist
          npx wrangler deploy --dry-run --config demo/wrangler.jsonc
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: |
            docs/dist
            landing/dist
          # .well-known/ is a hidden directory; v4 drops hidden files unless told otherwise
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspaces=false
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
      - run: npx wrangler deploy --config docs/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --config landing/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
